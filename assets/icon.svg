<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners for app icon -->
  <rect width="1024" height="1024" rx="200" fill="url(#iconGradient)"/>
  
  <!-- Card/Expense element (larger for icon) -->
  <rect x="360" y="320" width="304" height="200" rx="24" fill="#FFFFFF" opacity="0.95"/>
  <rect x="380" y="350" width="264" height="16" rx="8" fill="#8B5CF6" opacity="0.3"/>
  <rect x="380" y="390" width="200" height="16" rx="8" fill="#8B5CF6" opacity="0.3"/>
  <rect x="380" y="430" width="160" height="16" rx="8" fill="#8B5CF6" opacity="0.3"/>
  
  <!-- Swipe arrow (curved, larger) -->
  <path d="M 640 440 Q 760 400, 840 480 Q 760 560, 640 520" 
        stroke="#FFFFFF" 
        stroke-width="40" 
        stroke-linecap="round" 
        fill="none"
        opacity="0.9"/>
  
  <!-- Arrow head -->
  <path d="M 800 490 L 840 480 L 820 510 Z" 
        fill="#FFFFFF" 
        opacity="0.9"/>
  
  <!-- Swipe motion lines -->
  <circle cx="680" cy="460" r="8" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="720" cy="470" r="8" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="760" cy="480" r="8" fill="#FFFFFF" opacity="0.6"/>
</svg>

